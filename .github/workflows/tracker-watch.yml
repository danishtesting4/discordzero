name: Watch Vendetta Tracker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker-watch
  cancel-in-progress: false

jobs:
  check-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch tracker index and detect changes
        id: tracker
        env:
          TRACKER_INDEX_URL: https://tracker.vendetta.rocks/tracker/index
        run: python3 scripts/check_tracker.py

      - name: Commit updated tracker snapshot
        if: steps.tracker.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracker-index.json
          git commit -m "chore: update Vendetta tracker snapshot"
          git push
