name: Checks

on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "patches/**"
      - ".github/workflows/python-checks.yml"
      - ".github/workflows/test-unbloat.yml"
      - ".github/workflows/build-abi-apks.yml"
      - ".github/workflows/build-unbloat-abi-apks.yml"
      - ".github/workflows/inspect-discord-bundle.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "patches/**"
      - ".github/workflows/python-checks.yml"
      - ".github/workflows/test-unbloat.yml"
      - ".github/workflows/build-abi-apks.yml"
      - ".github/workflows/build-unbloat-abi-apks.yml"
      - ".github/workflows/inspect-discord-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Compile Python files
        run: python -m compileall -q scripts tests

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run feature helper tests
        run: node --test --experimental-strip-types tests/test_feature_helpers.test.mjs
