            "17835:guilds_bar_create_join_button"
            "9040:global_discovery_servers_9040"
            "15051:global_discovery_servers_15051"
            "15052:global_discovery_servers_15052"
            "15053:global_discovery_servers_15053"
            "19421:global_discovery_servers_19421"
            "19422:global_discovery_servers_19422"
            "19423:global_discovery_servers_19423"
            "162026:global_discovery_servers_162026"
            "1089:global_discovery_apps_1089"
            "1096:global_discovery_apps_1096"
            "64173:guild_directory_create_or_add"
            "64174:guild_directory_create_or_add_wrapper"
            "64186:guild_directory_handle_create_entry"
            "64188:guild_directory_handle_update_entry"
            "64212:guild_directory_create_or_add_description"
            "64221:guild_directory_templates"
            "64222:guild_directory_templates_wrapper"
            "64228:guild_directory_row"
            "42495:track_discovery_exited"
