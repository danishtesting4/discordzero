name: Inspect Discord Hermes bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Discord Android version"
        required: true
        default: "352.17"
        type: string
      source_run_id:
        description: "Successful per-ABI build run containing the arm64 APK"
        required: true
        default: "42805321472"
        type: string
  push:
    paths:
      - ".github/workflows/inspect-discord-bundle.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: discordzero-hermes-xref
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect Discord ${{ inputs.version || '352.17' }} Hermes bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISCORD_VERSION: ${{ inputs.version || '352.17' }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id || '42805321472' }}
    steps:
      - name: Check out DiscordZero
        uses: actions/checkout@v4

      - name: Download the existing arm64 APK artifact
        uses: actions/download-artifact@v4
        with:
          name: discordzero-${{ inputs.version || '352.17' }}-arm64-v8a
          path: build/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id || '42805321472' }}

      - name: Extract Hermes bundle
        run: |
          set -euo pipefail
          APK="build/source/discordzero-arm64-v8a.apk"
          test -s "$APK"
          mkdir -p build/inspection
          unzip -p "$APK" assets/index.android.bundle > build/inspection/index.android.bundle
          test -s build/inspection/index.android.bundle
          echo "APK: $(stat -c '%s bytes' "$APK")"
          echo "Hermes bundle: $(stat -c '%s bytes' build/inspection/index.android.bundle)"

      - name: Download and verify Hermes decompiler
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/SymbioticSec/hermes-decomp/releases/download/v0.2.4/hermes-decomp-v0.2.4-linux-x86_64.tar.gz" \
            --output "$RUNNER_TEMP/hermes-decomp.tar.gz"
          echo "6e070410432575698657b38d3497f66fd91c0c00f63880d6776703d81d99b5ac  $RUNNER_TEMP/hermes-decomp.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/hermes-decomp"
          tar -xzf "$RUNNER_TEMP/hermes-decomp.tar.gz" -C "$RUNNER_TEMP/hermes-decomp"
          find "$RUNNER_TEMP/hermes-decomp" -type f -name hermes-decomp -print -quit | grep -q .

      - name: Inspect HBC version, feature references, and target functions
        run: |
          set -euo pipefail
          BIN="$(find "$RUNNER_TEMP/hermes-decomp" -type f -name hermes-decomp -print -quit)"
          BUNDLE="build/inspection/index.android.bundle"
          REPORT="build/inspection/report"
          mkdir -p "$REPORT"

          "$BIN" info "$BUNDLE" > "$REPORT/info.txt"

          queries=(
            "Nitro"
            "Premium"
            "Discovery"
            "GIF"
            "autoplay"
            "preload"
            "decoration"
            "avatarDecoration"
            "banner"
            "Upsell"
            "getUserTrialOffer"
            "getUserDiscountOffer"
            "useNitroFileUploadAnnouncementEligible"
            "useNitroFileUploadUpsellEligible"
            "PREMIUM_MARKETING_SURFACE_REACHED_BOTTOM"
            "guild-upsell-list"
          )

          for query in "${queries[@]}"; do
            slug="$(printf '%s' "$query" | tr -c 'A-Za-z0-9_-' '_')"
            if timeout 120 "$BIN" xref "$BUNDLE" --query "$query" > "$REPORT/xref-$slug.txt"; then
              :
            else
              status=$?
              if [ "$status" -eq 124 ]; then
                echo "Timed out after 120 seconds: $query" > "$REPORT/xref-$slug.txt"
              else
                echo "xref exited with status $status for: $query" > "$REPORT/xref-$slug.txt"
              fi
            fi
          done

          targets=(
            "54776:use_auto_play"
            "71773:set_prefers_reduced_motion"
            "80867:nitro_file_upload_announcement_eligible"
            "80869:nitro_file_upload_upsell_eligible"
            "68204:nitro_upsell"
            "53877:nitro_upsell_button"
            "52970:premium_upsell_alert"
            "80858:nitro_file_upload_upsell_promo_sheet"
            "76221:premium_trial_offer_sheet"
            "80833:premium_discount_offer_sheet"
            "48469:user_profile_banner"
            "48251:preload_user_banner_image"
            "48142:use_user_avatar_decoration"
            "25837:get_avatar_decoration_url"
            "25773:avatar_decoration"
            "48497:header_avatar"
            "66894:user_avatar"
            "70989:avatar"
            "64670:application_command_discovery"
            "84048:global_discovery_banner_title"
            "84053:discoverable_guild_server"
          )

          for target in "${targets[@]}"; do
            id="${target%%:*}"
            label="${target#*:}"
            if timeout 90 "$BIN" decompile "$BUNDLE" --function "$id" \
              > "$REPORT/function-$id-$label.js" \
              2> "$REPORT/function-$id-$label.log"; then
              :
            else
              status=$?
              echo "Decompile failed or timed out (status $status) for function $id ($label)." \
                > "$REPORT/function-$id-$label.error"
            fi
          done

          {
            echo "Discord version: $DISCORD_VERSION"
            echo "Source build run: $SOURCE_RUN_ID"
            echo
            cat "$REPORT/info.txt"
            echo
            echo "Reference reports: $(find "$REPORT" -name 'xref-*.txt' | wc -l)"
            echo "Function decompilations: $(find "$REPORT" -name 'function-*.js' | wc -l)"
          } > "$REPORT/summary.txt"

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: discordzero-${{ inputs.version || '352.17' }}-hermes-analysis
          path: build/inspection/report/
          if-no-files-found: error
          retention-days: 7
