name: Download Discord APK inputs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Discord Android version (latest stable checked: 352.17)"
        required: true
        default: "352.17"
        type: string
      mirror:
        description: "Preferred download mirror"
        required: true
        default: "ushie-proxy"
        type: choice
        options:
          - ushie-proxy
          - vendetta-tracker
      abi:
        description: "Native library ABI split to download"
        required: true
        default: "arm64_v8a"
        type: choice
        options:
          - arm64_v8a
          - armeabi_v7a
          - x86_64
          - x86
          - all

permissions:
  contents: read

concurrency:
  group: discord-apk-download
  cancel-in-progress: false

jobs:
  download:
    name: Download Discord ${{ inputs.version }} inputs (${{ inputs.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out DiscordZero
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and validate APK splits
        env:
          DISCORD_VERSION: ${{ inputs.version }}
          PREFERRED_MIRROR: ${{ inputs.mirror }}
          ANDROID_ABI: ${{ inputs.abi }}
        run: |
          set -euo pipefail

          python scripts/download_base_apk.py \
            --version "$DISCORD_VERSION" \
            --split base \
            --mirror "$PREFERRED_MIRROR"

          python scripts/download_base_apk.py \
            --version "$DISCORD_VERSION" \
            --split config.en \
            --mirror "$PREFERRED_MIRROR"

          if [ "$ANDROID_ABI" = "all" ]; then
            ABIS="arm64_v8a armeabi_v7a x86_64 x86"
          else
            ABIS="$ANDROID_ABI"
          fi

          for abi in $ABIS; do
            echo "Downloading native library split for $abi"
            python scripts/download_base_apk.py \
              --version "$DISCORD_VERSION" \
              --split "config.$abi" \
              --mirror "$PREFERRED_MIRROR"
          done

          python scripts/download_base_apk.py \
            --version "$DISCORD_VERSION" \
            --split config.xxhdpi \
            --mirror "$PREFERRED_MIRROR"

      - name: Write input manifest
        env:
          DISCORD_VERSION: ${{ inputs.version }}
          PREFERRED_MIRROR: ${{ inputs.mirror }}
          ANDROID_ABI: ${{ inputs.abi }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          selected_abi = os.environ["ANDROID_ABI"]
          abis = (
              ["arm64_v8a", "armeabi_v7a", "x86_64", "x86"]
              if selected_abi == "all"
              else [selected_abi]
          )
          files = sorted(Path("build").glob("*.apk"))
          manifest = {
              "discord_version": os.environ["DISCORD_VERSION"],
              "preferred_mirror": os.environ["PREFERRED_MIRROR"],
              "abi_selection": selected_abi,
              "native_library_abis": abis,
              "files": [
                  {
                      "name": path.name,
                      "size": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
                  for path in files
              ],
          }
          Path("build/input-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload original APK inputs
        uses: actions/upload-artifact@v4
        with:
          name: discord-${{ inputs.version }}-${{ inputs.abi }}-inputs
          path: build/
          if-no-files-found: error
          retention-days: 7
